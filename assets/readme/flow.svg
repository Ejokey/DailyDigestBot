<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="260" viewBox="0 0 1200 260"
     role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Дневной цикл Daily Digest Bot</title>
  <desc id="flow-desc">Четыре стадии: утренний план, дневные обновления, вечерний чек-ин и перенос незакрытых задач на завтра.</desc>

  <rect width="1200" height="260" rx="26" fill="#0d1117"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#30363d"/>
    </marker>
  </defs>

  <text x="56" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14" letter-spacing="2" fill="#6b7280">КАК ЭТО РАБОТАЕТ · ОДИН ЦИКЛ = ОДИН ДЕНЬ</text>

  <line x1="205" y1="150" x2="255" y2="150" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="495" y1="150" x2="545" y2="150" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="785" y1="150" x2="835" y2="150" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 1075 190 Q 1075 230 200 230 Q 90 230 90 195"
        fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#arrow)"/>
  <text x="600" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#1f6feb" text-anchor="middle">незакрытое переносится на завтра</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

    <g id="stage-1" transform="translate(56 74)">
      <rect width="150" height="120" rx="16" fill="#161b22" stroke="#30363d"/>
      <circle cx="28" cy="28" r="14" fill="#21262d" stroke="#30363d"/>
      <text x="28" y="33" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">1</text>
      <text x="20" y="62" font-size="17" fill="#e6edf3" font-weight="600">Утро</text>
      <text x="20" y="86" font-size="13" fill="#8b949e">Текст → LLM →</text>
      <text x="20" y="103" font-size="13" fill="#8b949e">список задач</text>
    </g>

    <g id="stage-2" transform="translate(346 74)">
      <rect width="150" height="120" rx="16" fill="#161b22" stroke="#30363d"/>
      <circle cx="28" cy="28" r="14" fill="#21262d" stroke="#30363d"/>
      <text x="28" y="33" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">2</text>
      <text x="20" y="62" font-size="17" fill="#e6edf3" font-weight="600">День</text>
      <text x="20" y="86" font-size="13" fill="#8b949e">Добавить, отметить,</text>
      <text x="20" y="103" font-size="13" fill="#8b949e">убрать — просто текст</text>
    </g>

    <g id="stage-3" transform="translate(636 74)">
      <rect width="150" height="120" rx="16" fill="#161b22" stroke="#30363d"/>
      <circle cx="28" cy="28" r="14" fill="#21262d" stroke="#30363d"/>
      <text x="28" y="33" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">3</text>
      <text x="20" y="62" font-size="17" fill="#e6edf3" font-weight="600">Вечер</text>
      <text x="20" y="86" font-size="13" fill="#8b949e">Чек-ин сверяет ответ</text>
      <text x="20" y="103" font-size="13" fill="#8b949e">с утренним планом</text>
    </g>

    <g id="stage-4" transform="translate(926 74)">
      <rect width="150" height="120" rx="16" fill="#161b22" stroke="#1f6feb"/>
      <circle cx="28" cy="28" r="14" fill="#12243f" stroke="#1f6feb"/>
      <text x="28" y="33" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">4</text>
      <text x="20" y="62" font-size="17" fill="#e6edf3" font-weight="600">Перенос</text>
      <text x="20" y="86" font-size="13" fill="#8b949e">moved/partial →</text>
      <text x="20" y="103" font-size="13" fill="#8b949e">план на завтра</text>
    </g>

  </g>
</svg>
